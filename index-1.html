const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const TARGET=11000,SIZE=0.72,DURATION=10000;
let particles=[],startTime=null,stars=[];

function createStars(){
  stars=[];
  for(let i=0;i<200;i++){
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.25,a:Math.random()*.5+.12,tw:Math.random()*Math.PI*2});
  }
}
function drawStars(t){
  for(const s of stars){
    const tw=.55+.45*Math.sin(t*.0013+s.tw);
    ctx.beginPath();
    ctx.fillStyle=`rgba(210,225,255,${s.a*tw})`;
    ctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,Math.PI*2);
    ctx.fill();
  }
}

img.onload=()=>{
  resize();
  createStars();
  sample();
  startTime=performance.now();
  requestAnimationFrame(loop);
};

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;
  canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize",()=>{if(startTime){resize();createStars();}});

function sample(){
  particles=[];
  const maxW=Math.min(innerWidth*.8,560);
  const maxH=innerHeight*.8;
  const sc=Math.min(maxW/img.width,maxH/img.height);
  const dw=Math.floor(img.width*sc), dh=Math.floor(img.height*sc);
  const off=document.createElement("canvas");
  off.width=dw; off.height=dh;
  const o=off.getContext("2d");
  o.drawImage(img,0,0,dw,dh);
  const data=o.getImageData(0,0,dw,dh).data;
  const cx=innerWidth/2, cy=innerHeight/2;
  const ox=cx-dw/2, oy=cy-dh/2;
  const step=Math.max(1,Math.floor(Math.sqrt((dw*dh)/TARGET)));
  for(let y=0;y<dh;y+=step){
    for(let x=0;x<dw;x+=step){
      const i=(y*dw+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2];
      if(r<15&&g<15&&b<15) continue;
      if(r>145&&g<75&&b<75) continue;
      const ang=Math.random()*Math.PI*2;
      const dist=(.4+Math.random()*.7)*Math.max(innerWidth,innerHeight)*.7;
      particles.push({
        tx:ox+x, ty:oy+y,
        x:cx+Math.cos(ang)*dist,
        y:cy+Math.sin(ang)*dist,
        r:r*.9|0, g:g*.9|0, b:b*.9|0,
        size:SIZE+Math.random()*.4,
        delay:Math.random()*.3
      });
    }
  }
  console.log("Particles:",particles.length);
}

function ease(t){return 1-Math.pow(1-t,3)}

function loop(now){
  if(!startTime) startTime=now;
  const t=Math.min(1,(now-startTime)/DURATION);
  ctx.fillStyle="#010105";
  ctx.fillRect(0,0,innerWidth,innerHeight);
  const g=ctx.createRadialGradient(innerWidth*.5,innerHeight*.4,0,innerWidth*.5,innerHeight*.4,innerWidth*.65);
  g.addColorStop(0,"rgba(28,10,48,.32)");
  g.addColorStop(.5,"rgba(7,4,20,.13)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,innerWidth,innerHeight);
  drawStars(now);
  ctx.globalCompositeOperation="lighter";
  for(const p of particles){
    let pt=Math.max(0,(t-p.delay)/(1-p.delay*.5));
    pt=Math.min(1,pt);
    const e=ease(pt);
    const x=p.x+(p.tx-p.x)*e;
    const y=p.y+(p.ty-p.y)*e;
    const s=p.size*(.55+.45*e);
    ctx.beginPath();
    ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
    ctx.globalAlpha=.7+.3*e;
    ctx.arc(x,y,s,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
  ctx.globalAlpha=1;
  requestAnimationFrame(loop);
}
