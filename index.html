<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Portrait</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const DURATION = 10000;
const PARTICLE_COUNT = 4200;
const SIZE = 0.9;

let particles = [];
let startTime = null;
let stars = [];

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + 'px';
  canvas.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.55 + 0.12,
      tw: Math.random() * Math.PI * 2
    });
  }
}

function drawStars(t) {
  for (const s of stars) {
    const tw = 0.55 + 0.45 * Math.sin(t * 0.0013 + s.tw);
    ctx.beginPath();
    ctx.fillStyle = `rgba(210,225,255,${s.a * tw})`;
    ctx.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function isInsidePortrait(nx, ny) {
  const headX = nx / 0.38;
  const headY = (ny + 0.28) / 0.42;
  const inHead = headX * headX + headY * headY < 1;
  const inNeck = Math.abs(nx) < 0.11 && ny > 0.05 && ny < 0.32;
  const shoulderY = (ny - 0.42) / 0.28;
  const shoulderW = 0.55 + (ny - 0.25) * 0.9;
  const inShoulders = ny > 0.22 && ny < 0.72 && Math.abs(nx) < shoulderW && shoulderY * shoulderY < 1.1;
  const veilX = nx / 0.62;
  const veilY = (ny + 0.15) / 0.7;
  const inVeil = veilX * veilX + veilY * veilY < 1 && ny < 0.35;
  return inHead || inNeck || inShoulders || (inVeil && Math.random() > 0.35);
}

function createParticles() {
  particles = [];
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const scale = Math.min(innerWidth, innerHeight) * 0.42;
  let attempts = 0;
  while (particles.length < PARTICLE_COUNT && attempts < PARTICLE_COUNT * 12) {
    attempts++;
    const nx = (Math.random() * 2 - 1);
    const ny = (Math.random() * 2 - 1) * 0.95;
    if (!isInsidePortrait(nx, ny)) continue;
    const tx = cx + nx * scale;
    const ty = cy + ny * scale * 0.95;
    const ang = Math.random() * Math.PI * 2;
    const dist = (0.4 + Math.random() * 0.75) * Math.max(innerWidth, innerHeight) * 0.7;
    const tone = Math.random();
    let r, g, b;
    if (tone < 0.55) {
      r = 210 + Math.random() * 35;
      g = 160 + Math.random() * 40;
      b = 145 + Math.random() * 30;
    } else if (tone < 0.8) {
      r = 230 + Math.random() * 25;
      g = 230 + Math.random() * 25;
      b = 240 + Math.random() * 15;
    } else {
      r = 180 + Math.random() * 40;
      g = 190 + Math.random() * 40;
      b = 220 + Math.random() * 30;
    }
    particles.push({
      tx, ty,
      x: cx + Math.cos(ang) * dist,
      y: cy + Math.sin(ang) * dist,
      r: r | 0, g: g | 0, b: b | 0,
      size: SIZE + Math.random() * 0.5,
      delay: Math.random() * 0.32
    });
  }
}

function ease(t) {
  return 1 - Math.pow(1 - t, 3);
}

function loop(now) {
  if (!startTime) startTime = now;
  const t = Math.min(1, (now - startTime) / DURATION);
  ctx.fillStyle = '#020206';
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  const g = ctx.createRadialGradient(
    innerWidth * 0.5, innerHeight * 0.4, 0,
    innerWidth * 0.5, innerHeight * 0.4, innerWidth * 0.65
  );
  g.addColorStop(0, 'rgba(30, 12, 50, 0.38)');
  g.addColorStop(0.5, 'rgba(8, 5, 22, 0.16)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, innerWidth, innerHeight);
  drawStars(now);
  ctx.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    let pt = Math.max(0, (t - p.delay) / (1 - p.delay * 0.5));
    pt = Math.min(1, pt);
    const e = ease(pt);
    const x = p.x + (p.tx - p.x) * e;
    const y = p.y + (p.ty - p.y) * e;
    const s = p.size * (0.55 + 0.45 * e);
    ctx.beginPath();
    ctx.fillStyle = `rgb(${p.r},${p.g},${p.b})`;
    ctx.globalAlpha = 0.65 + 0.35 * e;
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  requestAnimationFrame(loop);
}

function init() {
  resize();
  createStars();
  createParticles();
  startTime = performance.now();
  requestAnimationFrame(loop);
}

addEventListener('resize', () => {
  resize();
  createStars();
  createParticles();
});

init();
</script>
</body>
</html>
