<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Portrait</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const TARGET=12000,SIZE=0.7,DURATION=10000;
let particles=[],startTime=null,stars=[];

function createStars(){
  stars=[];
  for(let i=0;i<220;i++){
    stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.15+.25,a:Math.random()*.5+.1,tw:Math.random()*Math.PI*2});
  }
}
function drawStars(t){
  for(const s of stars){
    const tw=.5+.5*Math.sin(t*.0012+s.tw);
    ctx.beginPath();
    ctx.fillStyle=`rgba(200,220,255,${s.a*tw})`;
    ctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,Math.PI*2);
    ctx.fill();
  }
}

const img=new Image();
img.src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKjgxLigoMjU1Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojr/wAARCAMgASADASIAAhEBAxEB/8QAFQABAQAAAAAAAAAAAAAAAAAAAAn/xAAUEAEAAAAAAAAAAAAAAAAAAAAA/8QAFQEBAQAAAAAAAAAAAAAAAAAAAAX/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIQAxAAAAGcA//EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAQUCf//EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQMBAT8Bf//EABQRAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQIBAT8Bf//EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEABj8Cf//EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAT8hf//Z";
img.onload=()=>{
  resize();
  createStars();
  sample();
  startTime=performance.now();
  requestAnimationFrame(loop);
};

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*dpr;
  canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+'px';
  canvas.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',()=>{if(startTime){resize();createStars();}});

function sample(){
  particles=[];
  const maxW=Math.min(innerWidth*.78,520);
  const maxH=innerHeight*.78;
  let iw=img.width,ih=img.height;
  const sc=Math.min(maxW/iw,maxH/ih);
  const dw=Math.floor(iw*sc),dh=Math.floor(ih*sc);
  const off=document.createElement('canvas');
  off.width=dw;off.height=dh;
  const o=off.getContext('2d');
  o.drawImage(img,0,0,dw,dh);
  const data=o.getImageData(0,0,dw,dh).data;
  const cx=innerWidth/2,cy=innerHeight/2;
  const ox=cx-dw/2,oy=cy-dh/2;
  const step=Math.max(1,Math.floor(Math.sqrt((dw*dh)/TARGET)));
  for(let y=0;y<dh;y+=step){
    for(let x=0;x<dw;x+=step){
      const i=(i=(y*dw+x)*4;
      const r=data[i],g=data[i+1],b=data[i+2],a=data[i+3];
      if(a<20||(r<18&&g<18&&b<18)) continue;
      if(r>150&&g<70&&b<70) continue;
      const ang=Math.random()*Math.PI*2;
      const dist=(.42+Math.random()*.7)*Math.max(innerWidth,innerHeight)*.72;
      particles.push({
        tx:ox+x, ty:oy+y,
        x:cx+Math.cos(ang)*dist,
        y:cy+Math.sin(ang)*dist,
        r:Math.floor(r*.88),
        g:Math.floor(g*.88),
        b:Math.floor(b*.88),
        size:SIZE+Math.random()*.45,
        delay:Math.random()*.28
      });
    }
  }
  console.log('Particles:',particles.length);
}

function ease(t){return 1-Math.pow(1-t,3)}

function loop(now){
  if(!startTime)startTime=now;
  const t=Math.min(1,(now-startTime)/DURATION);
  ctx.fillStyle='#010105';
  ctx.fillRect(0,0,innerWidth,innerHeight);
  const g=ctx.createRadialGradient(innerWidth*.5,innerHeight*.42,0,innerWidth*.5,innerHeight*.42,innerWidth*.7);
  g.addColorStop(0,'rgba(25,10,45,.32)');
  g.addColorStop(.5,'rgba(6,4,18,.14)');
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,innerWidth,innerHeight);
  drawStars(now);
  ctx.globalCompositeOperation='lighter';
  for(const p of particles){
    let pt=Math.max(0,(t-p.delay)/(1-p.delay*.45));
    pt=Math.min(1,pt);
    const e=ease(pt);
    const x=p.x+(p.tx-p.x)*e;
    const y=p.y+(p.ty-p.y)*e;
    const s=p.size*(.55+.45*e);
    ctx.beginPath();
    ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
    ctx.globalAlpha=.7+.3*e;
    ctx.arc(x,y,s,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
