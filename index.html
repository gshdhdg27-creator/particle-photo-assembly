<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Assembly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="photo.js"></script>
<script>
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
const TARGET=7000,SIZE=0.65,DURATION=10000;
let particles=[],startTime=null,stars=[];
function createStars(){stars=[];for(let i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.05+.2,a:Math.random()*.5+.1,tw:Math.random()*Math.PI*2})}
function drawStars(t){for(const s of stars){const tw=.5+.5*Math.sin(t*.0013+s.tw);ctx.beginPath();ctx.fillStyle=`rgba(200,220,255,${s.a*tw})`;ctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,Math.PI*2);ctx.fill()}}
const img=new Image();
img.onload=()=>{resize();createStars();sample();startTime=performance.now();requestAnimationFrame(loop)};
img.src="data:image/jpeg;base64,"+window.PHOTO_B64;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",()=>{if(startTime){resize();createStars()}});
function sample(){particles=[];const maxW=Math.min(innerWidth*.88,520),maxH=innerHeight*.82;let iw=img.width,ih=img.height;const sc=Math.min(maxW/iw,maxH/ih);const dw=Math.floor(iw*sc),dh=Math.floor(ih*sc);const off=document.createElement("canvas");off.width=dw;off.height=dh;const o=off.getContext("2d");o.drawImage(img,0,0,dw,dh);const data=o.getImageData(0,0,dw,dh).data;const cx=innerWidth/2,cy=innerHeight/2,ox=cx-dw/2,oy=cy-dh/2;const step=Math.max(1,Math.floor(Math.sqrt((dw*dh)/TARGET)));for(let y=0;y<dh;y+=step)for(let x=0;x<dw;x+=step){const i=(y*dw+x)*4;if(data[i+3]<25)continue;const r=data[i],g=data[i+1],b=data[i+2];if(r>170&&g<60&&b<60)continue;const ang=Math.random()*Math.PI*2,dist=(.38+Math.random()*.7)*Math.max(innerWidth,innerHeight)*.7;particles.push({tx:ox+x,ty:oy+y,x:cx+Math.cos(ang)*dist,y:cy+Math.sin(ang)*dist,r:r*.78|0,g:g*.78|0,b:b*.78|0,size:SIZE+Math.random()*.3,delay:Math.random()*.3})}}
function ease(t){return 1-Math.pow(1-t,3)}
function loop(now){if(!startTime)startTime=now;const t=Math.min(1,(now-startTime)/DURATION);ctx.fillStyle="#020206";ctx.fillRect(0,0,innerWidth,innerHeight);const g=ctx.createRadialGradient(innerWidth*.5,innerHeight*.4,0,innerWidth*.5,innerHeight*.4,innerWidth*.6);g.addColorStop(0,"rgba(30,10,50,.35)");g.addColorStop(.5,"rgba(8,5,20,.15)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);drawStars(now);ctx.globalCompositeOperation="lighter";for(const p of particles){let pt=Math.max(0,(t-p.delay)/(1-p.delay*.5));pt=Math.min(1,pt);const e=ease(pt);const x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e;const s=p.size*(.6+.4*e);ctx.beginPath();ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;ctx.globalAlpha=.65+.35*e;ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation="source-over";ctx.globalAlpha=1;requestAnimationFrame(loop)}
</script>
</body>
</html>
