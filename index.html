<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Assembly</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const TARGET=7500,SIZE=0.7,DURATION=10000;
let particles=[],startTime=null,stars=[];
function createStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.1+.25,a:Math.random()*.55+.12,tw:Math.random()*Math.PI*2})}
function drawStars(t){for(const s of stars){const tw=.55+.45*Math.sin(t*.0014+s.tw);ctx.beginPath();ctx.fillStyle=`rgba(210,225,255,${s.a*tw})`;ctx.arc(s.x*innerWidth,s.y*innerHeight,s.r,0,Math.PI*2);ctx.fill()}}
const img=new Image();
img.src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQcHBwoIChMKChMoGhYaKjgxLigoMjU1Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojo6Ojr/wAARCAJYAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIQAxAAAAAAAAH/2Q==";
img.onload=()=>{resize();createStars();sample();startTime=performance.now();requestAnimationFrame(loop)};
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',()=>{if(startTime){resize();createStars()}});
function sample(){particles=[];const maxW=Math.min(innerWidth*.86,560),maxH=innerHeight*.8;let iw=img.width,ih=img.height;const sc=Math.min(maxW/iw,maxH/ih);const dw=Math.floor(iw*sc),dh=Math.floor(ih*sc);const off=document.createElement('canvas');off.width=dw;off.height=dh;const o=off.getContext('2d');o.drawImage(img,0,0,dw,dh);const data=o.getImageData(0,0,dw,dh).data;const cx=innerWidth/2,cy=innerHeight/2,ox=cx-dw/2,oy=cy-dh/2;const step=Math.max(1,Math.floor(Math.sqrt((dw*dh)/TARGET)));for(let y=0;y<dh;y+=step){for(let x=0;x<dw;x+=step){const i=(y*dw+x)*4;if(data[i+3]<28)continue;const r=data[i],g=data[i+1],b=data[i+2];if(r>175&&g<65&&b<65)continue;const ang=Math.random()*Math.PI*2,dist=(.4+Math.random()*.7)*Math.max(innerWidth,innerHeight)*.72;particles.push({tx:ox+x,ty:oy+y,x:cx+Math.cos(ang)*dist,y:cy+Math.sin(ang)*dist,r:Math.floor(r*.8),g:Math.floor(g*.8),b:Math.floor(b*.8),size:SIZE+Math.random()*.35,delay:Math.random()*.32})}}}
function ease(t){return 1-Math.pow(1-t,3)}
function loop(now){if(!startTime)startTime=now;const t=Math.min(1,(now-startTime)/DURATION);ctx.fillStyle='#020206';ctx.fillRect(0,0,innerWidth,innerHeight);const g=ctx.createRadialGradient(innerWidth*.5,innerHeight*.42,0,innerWidth*.5,innerHeight*.42,innerWidth*.65);g.addColorStop(0,'rgba(28,12,45,.4)');g.addColorStop(.55,'rgba(8,6,20,.18)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);drawStars(now);ctx.globalCompositeOperation='lighter';for(const p of particles){let pt=Math.max(0,(t-p.delay)/(1-p.delay*.55));pt=Math.min(1,pt);const e=ease(pt);const x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e;const s=p.size*(.65+.35*e);ctx.beginPath();ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;ctx.globalAlpha=.7+.3*e;ctx.arc(x,y,s,0,Math.PI*2);ctx.fill()}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;requestAnimationFrame(loop)}
</script>
</body>
</html>
