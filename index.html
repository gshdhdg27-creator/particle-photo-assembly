<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Photo Assembly — Пыль собирается в фото</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(255, 200, 220, 0.15);
    }
    .controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 10;
      background: rgba(20, 20, 25, 0.9);
      backdrop-filter: blur(12px);
      padding: 10px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.08);
      flex-wrap: wrap;
      justify-content: center;
    }
    button, label.btn {
      background: linear-gradient(135deg, #c9a0a8, #8b5a6b);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      display: inline-block;
    }
    button:hover, label.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 160, 168, 0.4);
    }
    input[type="file"] { display: none; }
    .info {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      opacity: 0.55;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      max-width: 90%;
    }
  </style>
</head>
<body>
  <div class="info">Выбери фото → частицы соберутся в него</div>
  <canvas id="c"></canvas>
  <div class="controls">
    <label class="btn" for="fileInput">Выбрать фото</label>
    <input type="file" id="fileInput" accept="image/*">
    <button id="btnAssemble">Собрать</button>
    <button id="btnScatter">Разлететься</button>
    <button id="btnRestart">Заново</button>
  </div>

  <script>
    const PARTICLE_COUNT_TARGET = 4000;
    const PARTICLE_SIZE = 1.5;
    const EASE = 0.07;
    const SCATTER_FORCE = 16;
    const FRICTION = 0.91;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let imgData = null;
    let state = 'scattered';
    let hasImage = false;

    canvas.width = 600;
    canvas.height = 600;
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, 600, 600);
    ctx.fillStyle = '#666';
    ctx.font = '16px system-ui';
    ctx.textAlign = 'center';
    ctx.fillText('Выбери фото девушки', 300, 290);
    ctx.fillText('кнопкой ниже', 300, 320);

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const maxW = Math.min(window.innerWidth * 0.92, 720);
          const maxH = window.innerHeight * 0.75;
          let w = img.width, h = img.height;
          const ratio = Math.min(maxW / w, maxH / h, 1);
          w = Math.floor(w * ratio);
          h = Math.floor(h * ratio);
          canvas.width = w;
          canvas.height = h;

          const off = document.createElement('canvas');
          off.width = w; off.height = h;
          const octx = off.getContext('2d');
          octx.drawImage(img, 0, 0, w, h);
          imgData = octx.getImageData(0, 0, w, h);
          createParticles();
          scatter(true);
          hasImage = true;
          setTimeout(() => assemble(), 600);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function createParticles() {
      particles = [];
      const data = imgData.data;
      const w = canvas.width, h = canvas.height;
      const step = Math.max(1, Math.floor(Math.sqrt((w * h) / PARTICLE_COUNT_TARGET)));
      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const i = (y * w + x) * 4;
          if (data[i + 3] < 40) continue;
          particles.push({
            tx: x, ty: y, x: x, y: y, vx: 0, vy: 0,
            color: `rgb(${data[i]},${data[i+1]},${data[i+2]})`,
            size: PARTICLE_SIZE + Math.random() * 0.6
          });
        }
      }
    }

    function scatter(instant = false) {
      if (!particles.length) return;
      state = 'scattered';
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const maxD = Math.max(canvas.width, canvas.height) * 0.55;
      particles.forEach(p => {
        const a = Math.random() * Math.PI * 2;
        const d = (Math.random() * 0.55 + 0.45) * maxD;
        const nx = cx + Math.cos(a) * d;
        const ny = cy + Math.sin(a) * d;
        if (instant) { p.x = nx; p.y = ny; p.vx = 0; p.vy = 0; }
        else {
          p.vx = (nx - p.x) * 0.07 + (Math.random() - 0.5) * SCATTER_FORCE;
          p.vy = (ny - p.y) * 0.07 + (Math.random() - 0.5) * SCATTER_FORCE;
        }
      });
    }

    function assemble() { if (particles.length) state = 'assembling'; }

    function update() {
      if (!particles.length) return;
      let allClose = true;
      for (const p of particles) {
        if (state === 'assembling' || state === 'formed') {
          const dx = p.tx - p.x, dy = p.ty - p.y;
          p.vx += dx * EASE; p.vy += dy * EASE;
          p.vx *= FRICTION; p.vy *= FRICTION;
          p.x += p.vx; p.y += p.vy;
          if (Math.abs(dx) > 1.2 || Math.abs(dy) > 1.2) allClose = false;
        } else {
          p.x += p.vx; p.y += p.vy;
          p.vx *= 0.96; p.vy *= 0.96;
        }
      }
      if (state === 'assembling' && allClose) state = 'formed';
    }

    function draw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (!particles.length) return;
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.9;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    function animate() {
      update();
      draw();
      requestAnimationFrame(animate);
    }
    animate();

    document.getElementById('btnAssemble').onclick = assemble;
    document.getElementById('btnScatter').onclick = () => scatter(false);
    document.getElementById('btnRestart').onclick = () => {
      scatter(true);
      setTimeout(assemble, 400);
    };

    canvas.addEventListener('click', (e) => {
      if (!particles.length) return;
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);
      particles.forEach(p => {
        const dx = p.x - mx, dy = p.y - my;
        const d = Math.hypot(dx, dy) || 1;
        if (d < 140) {
          const f = (140 - d) / 140 * 14;
          p.vx += (dx / d) * f;
          p.vy += (dy / d) * f;
        }
      });
      state = 'scattered';
    });
  </script>
</body>
</html>
