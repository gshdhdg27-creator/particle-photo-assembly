<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Photo Assembly — Dust to Portrait</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 0 40px rgba(255, 200, 220, 0.15);
    }
    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    button {
      background: linear-gradient(135deg, #c9a0a8, #8b5a6b);
      border: none;
      color: #fff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(201, 160, 168, 0.4);
    }
    button:active { transform: translateY(0); }
    .info {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      opacity: 0.6;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="info">Particles assembling into photo</div>
  <canvas id="c"></canvas>
  <div class="controls">
    <button id="btnAssemble">Собрать</button>
    <button id="btnScatter">Разлететься</button>
    <button id="btnRestart">Заново</button>
  </div>

  <script src="photo.js"></script>
  <script>
    // ===== CONFIG =====
    const PARTICLE_COUNT_TARGET = 3800;
    const PARTICLE_SIZE = 1.55;
    const EASE = 0.068;
    const SCATTER_FORCE = 18;
    const FRICTION = 0.92;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let img = new Image();
    let imgData = null;
    let state = 'scattered';

    img.src = "data:image/jpeg;base64," + PHOTO_BASE64;

    img.onload = () => {
      const maxW = Math.min(window.innerWidth * 0.92, 720);
      const maxH = window.innerHeight * 0.78;
      let w = img.width;
      let h = img.height;
      const ratio = Math.min(maxW / w, maxH / h);
      w = Math.floor(w * ratio);
      h = Math.floor(h * ratio);

      canvas.width = w;
      canvas.height = h;

      const off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      const octx = off.getContext('2d');
      octx.drawImage(img, 0, 0, w, h);
      imgData = octx.getImageData(0, 0, w, h);

      createParticles();
      scatter(true);
      animate();
    };

    function createParticles() {
      particles = [];
      const data = imgData.data;
      const w = canvas.width;
      const h = canvas.height;
      const totalPixels = w * h;
      let step = Math.max(1, Math.floor(Math.sqrt(totalPixels / PARTICLE_COUNT_TARGET)));

      for (let y = 0; y < h; y += step) {
        for (let x = 0; x < w; x += step) {
          const i = (y * w + x) * 4;
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const a = data[i + 3];
          if (a < 40) continue;

          particles.push({
            tx: x, ty: y,
            x: x, y: y,
            vx: 0, vy: 0,
            color: `rgb(${r},${g},${b})`,
            size: PARTICLE_SIZE + Math.random() * 0.7
          });
        }
      }
      console.log('Particles:', particles.length);
    }

    function scatter(instant = false) {
      state = 'scattered';
      particles.forEach(p => {
        const angle = Math.random() * Math.PI * 2;
        const dist = (Math.random() * 0.6 + 0.4) * Math.max(canvas.width, canvas.height) * 0.55;
        const nx = canvas.width / 2 + Math.cos(angle) * dist;
        const ny = canvas.height / 2 + Math.sin(angle) * dist;
        if (instant) {
          p.x = nx; p.y = ny; p.vx = 0; p.vy = 0;
        } else {
          p.vx = (nx - p.x) * 0.08 + (Math.random() - 0.5) * SCATTER_FORCE;
          p.vy = (ny - p.y) * 0.08 + (Math.random() - 0.5) * SCATTER_FORCE;
        }
      });
    }

    function assemble() {
      state = 'assembling';
    }

    function update() {
      let allClose = true;
      for (const p of particles) {
        if (state === 'assembling' || state === 'formed') {
          const dx = p.tx - p.x;
          const dy = p.ty - p.y;
          p.vx += dx * EASE;
          p.vy += dy * EASE;
          p.vx *= FRICTION;
          p.vy *= FRICTION;
          p.x += p.vx;
          p.y += p.vy;
          if (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5) allClose = false;
        } else {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.97;
          p.vy *= 0.97;
        }
      }
      if (state === 'assembling' && allClose) state = 'formed';
    }

    function draw() {
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        ctx.beginPath();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = 0.88;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }

    function animate() {
      update();
      draw();
      requestAnimationFrame(animate);
    }

    document.getElementById('btnAssemble').onclick = () => assemble();
    document.getElementById('btnScatter').onclick = () => scatter(false);
    document.getElementById('btnRestart').onclick = () => {
      scatter(true);
      setTimeout(() => assemble(), 450);
    };

    setTimeout(() => {
      if (state === 'scattered') assemble();
    }, 1100);

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);
      particles.forEach(p => {
        const dx = p.x - mx;
        const dy = p.y - my;
        const d = Math.sqrt(dx * dx + dy * dy) || 1;
        if (d < 130) {
          const force = (130 - d) / 130 * 15;
          p.vx += (dx / d) * force;
          p.vy += (dy / d) * force;
        }
      });
      state = 'scattered';
    });
  </script>
</body>
</html>
