img.onload=()=>{resize();createStars();sample();startTime=performance.now();requestAnimationFrame(loop)};
function resize(){const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",()=>{if(startTime){resize();createStars()}});
function sample(){
  particles=[];
  const maxW=Math.min(innerWidth*.85,680),maxH=innerHeight*.85;
  const sc=Math.min(maxW/img.width,maxH/img.height);
  const dw=Math.floor(img.width*sc),dh=Math.floor(img.height*sc);
  const off=document.createElement("canvas");off.width=dw;off.height=dh;
  const o=off.getContext("2d");o.drawImage(img,0,0,dw,dh);
  const data=o.getImageData(0,0,dw,dh).data;
  const cx=innerWidth/2,cy=innerHeight/2,ox=cx-dw/2,oy=cy-dh/2;
  const step=Math.max(1,Math.floor(Math.sqrt((dw*dh)/TARGET)));
  for(let y=0;y<dh;y+=step)for(let x=0;x<dw;x+=step){
    const i=(y*dw+x)*4,r=data[i],g=data[i+1],b=data[i+2];
    if(r<10&&g<10&&b<10)continue;
    if(r>125&&g<100&&b<100&&r>g+20)continue;
    const ang=Math.random()*Math.PI*2,dist=(.35+Math.random()*.7)*Math.max(innerWidth,innerHeight)*.65;
    particles.push({tx:ox+x,ty:oy+y,x:cx+Math.cos(ang)*dist,y:cy+Math.sin(ang)*dist,r:(r*.93)|0,g:(g*.93)|0,b:(b*.93)|0,size:SIZE+Math.random()*.2,delay:Math.random()*.22});
  }
  console.log("Particles:",particles.length);
}
function ease(t){return 1-Math.pow(1-t,3)}
function loop(now){
  if(!startTime)startTime=now;
  const t=Math.min(1,(now-startTime)/DURATION);
  ctx.fillStyle="#010105";ctx.fillRect(0,0,innerWidth,innerHeight);
  const g=ctx.createRadialGradient(innerWidth*.5,innerHeight*.4,0,innerWidth*.5,innerHeight*.4,innerWidth*.55);
  g.addColorStop(0,"rgba(22,8,40,.25)");g.addColorStop(.5,"rgba(5,3,14,.08)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,innerWidth,innerHeight);drawStars(now);
  for(const p of particles){
    let pt=Math.max(0,(t-p.delay)/(1-p.delay*.35));pt=Math.min(1,pt);const e=ease(pt);
    const x=p.x+(p.tx-p.x)*e,y=p.y+(p.ty-p.y)*e,s=p.size*(.45+.55*e);
    ctx.beginPath();ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;ctx.globalAlpha=.9+.1*e;ctx.arc(x,y,s,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;requestAnimationFrame(loop);
}
